name: Generate and Output Release Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    name: Generate Production Keystore
    runs-on: ubuntu-latest
    steps:
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔑 Generate Keystore & Output Base64
        run: |
          set -e
          ALIAS="yakhchalman"
          PASS="YakhchalManProductionSecretKey2026!"
          
          echo "Generating production keystore..."
          keytool -genkeypair -v \
            -keystore yakhchal-man-release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Yakhchal Man, OU=Mobile, O=Reza Movahedi, L=Tehran, ST=Tehran, C=IR"

          KEYSTORE_B64=$(base64 -w 0 yakhchal-man-release.keystore)
          echo "---KEYSTORE_START---"
          echo "$KEYSTORE_B64"
          echo "---KEYSTORE_END---"
