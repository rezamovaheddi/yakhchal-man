name: Generate and Set Release Keystore Secrets

on:
  workflow_dispatch:

permissions:
  secrets: write
  contents: read

jobs:
  generate-keystore:
    name: Generate Production Keystore
    runs-on: ubuntu-latest
    steps:
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔑 Generate Keystore & Save Secrets via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ALIAS="yakhchalman"
          PASS="YakhchalManProductionSecretKey2026!"
          
          echo "Generating production keystore..."
          keytool -genkeypair -v \
            -keystore yakhchal-man-release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Yakhchal Man, OU=Mobile, O=Reza Movahedi, L=Tehran, ST=Tehran, C=IR"

          KEYSTORE_B64=$(base64 -w 0 yakhchal-man-release.keystore)

          echo "Setting repository secrets using GitHub CLI..."
          gh secret set ANDROID_KEYSTORE_BASE64 --body "$KEYSTORE_B64" --repo "${{ github.repository }}"
          gh secret set ANDROID_KEYSTORE_PASSWORD --body "$PASS" --repo "${{ github.repository }}"
          gh secret set ANDROID_KEY_ALIAS --body "$ALIAS" --repo "${{ github.repository }}"
          gh secret set ANDROID_KEY_PASSWORD --body "$PASS" --repo "${{ github.repository }}"

          echo "✅ All Android Release Keystore secrets set successfully in repo secrets!"
