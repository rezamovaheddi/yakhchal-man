name: Build and Release Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🧪 Run Unit Tests
        run: npm test

      - name: 🔍 Run TypeScript Check
        run: npm run typecheck

      - name: ⚙️ Expo Prebuild (Generate Android Project)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Android APK (Debug & Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📋 Copy Built APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/yakhchal-man.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yakhchal-man-apk
          path: build-output/yakhchal-man.apk

      - name: 🚀 Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_name == 'master' && 'v1.0.0' || github.ref_name == 'main' && 'v1.0.0' || github.ref_name }}
          name: ${{ format('یخچال من (My Fridge) - {0}', github.ref_name == 'master' && 'v1.0.0' || github.ref_name == 'main' && 'v1.0.0' || github.ref_name) }}
          body: |
            ## 🍳 اپلیکیشن فارسی «یخچال من» (My Fridge)
            طراحی شده با الهام از رابط کاربری رترو سیستم‌عامل‌های دهه ۱۹۹۰ و منطبق بر طرح مرجع.
            
            ### ✨ امکانات و قابلیت‌ها:
            - هدر رترو با لوگوی یخچال و دکمه‌های کنترلی سیستم‌عامل
            - فرم ثبت نام یخچال با فیلد اختصاصی و بازخورد اعلان (Toast)
            - شبکه کارت‌های موجودی یخچال با آیکون‌های وکتور، شمارشگر و دکمه‌های افزایش/کاهش
            - فرم افزودن ماده غذایی جدید با انتخاب واحد، دسته‌بندی و آیکون
            - بخش پیشنهاد هوشمند «امروز چی بپزم؟» با نوار پیشرفت قطعه‌ای رترو بر اساس موجودی واقعی
            - مشاهده دستور پخت گام‌به‌گام با چک‌لیست اقلام موجود و نکات طلایی سرآشپز
            - نوار ناوبری ثابت پایینی با ۳ تب: خانه، آشپزی، دستور پخت
            - تایمر دیجیتال پخت و پز رترو
            
            ### 📱 فایل خروجی APK:
            می‌توانید فایل `yakhchal-man.apk` را مستقیماً دانلود و روی گوشی اندروید خود نصب کنید.
          files: build-output/yakhchal-man.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
