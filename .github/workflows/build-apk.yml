name: Build and Release Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🧪 Run Unit Tests
        run: npm test

      - name: 🔍 Run TypeScript Check
        run: npm run typecheck

      - name: ⚙️ Expo Prebuild (Generate Android Project)
        run: npx expo prebuild --platform android --no-install

      - name: 🔨 Build Android APK (Release & Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon

      - name: 📋 Copy Built APK
        run: |
          mkdir -p build-output
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/yakhchal-man.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/yakhchal-man.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/yakhchal-man.apk
          fi

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yakhchal-man-apk
          path: build-output/yakhchal-man.apk

      - name: 🏷️ Determine Release Tag and Title
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="یخچال من (My Fridge) - ${TAG_NAME}"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            TAG_NAME="v1.1.${{ github.run_number }}"
            RELEASE_NAME="یخچال من (My Fridge) - ${TAG_NAME} (${SHORT_SHA})"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT

      - name: 🚀 Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body: |
            ## 🍳 اپلیکیشن فارسی «یخچال من» (My Fridge) - نسخه جدید ${{ steps.release_info.outputs.tag_name }}
            طراحی شده با الهام از رابط کاربری رترو سیستم‌عامل‌های دهه ۱۹۹۰ و سبک Neo-Brutalist.
            
            ### ✨ تغییرات و امکانات نسخه جدید:
            - 🤖 **سرآشپز هوش مصنوعی (Gemini LLM):** تحلیل موجودی یخچال و پیشنهاد ۳ غذای منتخب اختصاصی همراه با مراحل پخت و مواد کمبوددار
            - ☁️ **اتصال ابری کلادفلر (Cloudflare Tunnel):** ارتباط آنلاین و بدون قطعی با سرور بک‌اند در هر نقطه از اینترنت
            - 👤 **سیستم ساخت حساب کاربری و ورود (Authentication):** ثبت‌نام، ورود به حساب و ذخیره‌سازی ابری/محلی
            - 🧊 **سامانه ضد دورریز و قفسه اضطراری:** هشدار انقضای مواد، تخمین صرفه‌جویی ماهانه و پیشنهاد مصرف اقلام زودمصرف
            - 🎨 **آیکون‌های بازطراحی‌شده و نوستالژیک:** آیکون‌های وکتور اختصاصی مواد غذایی و آواتارهای رترو
            - ⏱️ **تایمر رترو و دفترچه آشپزی دیجیتال**
            
            ### 📱 فایل خروجی APK:
            می‌توانید فایل `yakhchal-man.apk` را مستقیماً از بخش Assets همین ریلیز دانلود و روی گوشی اندروید خود نصب کنید.
          files: build-output/yakhchal-man.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
